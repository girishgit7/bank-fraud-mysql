{% extends "base.html" %}
{% block body %}
<div class="app">
  <aside class="rail">
    <a class="wordmark" href="{{ url_for('pages.home') }}" aria-label="Ledgerwatch home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l10 12-10 12L6 16z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 11v10M11.5 16h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Ledgerwatch</span>
    </a>
    <nav class="rail-nav" aria-label="Sections">
      {% block nav %}{% endblock %}
    </nav>
    <div class="rail-user">
      <div class="rail-user-name">{{ user.name }}</div>
      <div class="rail-user-role">{{ 'Fraud analyst' if user.role == 'admin' else 'Customer' }}</div>
      <button class="rail-signout" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main class="main" id="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
